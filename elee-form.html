/* brand: lands in the middle, then docks at the top */
.brand{position:absolute;z-index:5;left:50%;top:50vh;width:min(440px,78vw);transform:translate(-50%,-50%) scale(1);transform-origin:50% 0;
  display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0;pointer-events:none;
  transition:opacity .9s ease, top 1s cubic-bezier(.7,0,.2,1), transform 1s cubic-bezier(.7,0,.2,1)}
.brand svg{width:100%;height:auto;display:block;fill:currentColor}
.brand .tag{font-weight:500;font-size:clamp(14px,3.4vw,19px);letter-spacing:.32em;text-transform:uppercase;padding-left:.32em;white-space:nowrap}
body.in .brand{opacity:1}
body.docked .brand{top:22px;transform:translate(-50%,0) scale(var(--s,.38))}

/* page shell */
.page{position:relative;z-index:2;min-height:100vh;padding:var(--top,200px) max(5vw,16px) 56px;display:flex;justify-content:center}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1)}
body.open .reveal{opacity:1;transform:none}
body.open .reveal[style*="--i"]{transition-delay:calc(var(--i)*90ms + 120ms)}

h1{font-weight:500;font-size:clamp(30px,6vw,40px);line-height:1.08;letter-spacing:-.01em;margin:0 0 8px;text-wrap:balance}
.sub{margin:0 0 22px;max-width:38ch}
label{display:block;font-weight:500;font-size:15px;margin:0 0 8px}
input{width:100%;font:inherit;font-size:16px;color:#161616;height:52px;padding:0 16px;border:1px solid var(--line);border-radius:14px;background:#fff;outline:none;transition:border-color .2s, box-shadow .2s}
input:focus-visible{border-color:var(--ink);box-shadow:0 0 0 3px rgba(185,133,211,.45)}
input[aria-invalid=true]{border-color:#A3245A}
.err{color:#8E1F4D;font-size:14px;margin:4px 0 0}.err:empty{display:none}

.done p{color:var(--muted)}

function play(){
  timers.forEach(clearTimeout); timers=[];
  b.classList.remove('in','docked','open'); layout();
  if(reduce){b.classList.add('in','docked','open');return}
  timers.push(setTimeout(()=>b.classList.add('in'),120));
  timers.push(setTimeout(()=>{layout();b.classList.add('docked')},1700));
  timers.push(setTimeout(()=>b.classList.add('open'),2250));
}

addEventListener('resize',()=>{if(b.classList.contains('docked'))layout()});

f.addEventListener('submit',async e=>{
  e.preventDefault();
  const bad=ids.filter(id=>!check(id));
  if(bad.length){document.getElementById(bad[0]).focus();return}
  const data=new URLSearchParams();
  ids.forEach(id=>data.append(MAP[id],document.getElementById(id).value.trim()));
  const go=document.getElementById('go'); go.disabled=true;
  const w=document.getElementById('name').value.trim().split(/\s+/)[0]; const first=w.charAt(0).toUpperCase()+w.slice(1);
  let sent=false;
  try{await fetch(FORM+'formResponse',{method:'POST',mode:'no-cors',body:data});sent=true}catch(err){sent=false}
  f.classList.add('hide'); done.classList.add('show');
  const t=document.getElementById('doneTitle'), p=document.getElementById('doneText'), a=document.getElementById('doneLink');
  if(sent){t.textContent='Thank you '+first+'!';p.textContent='You\'re on the list. We\'ll be in touch soon.';a.hidden=true}
  else{
    t.textContent='Almost there '+first+'!';
    p.textContent='This preview can\'t send answers by itself. Open the Google Form to finish: your answers are already filled in.';
    a.href=FORM+'viewform?usp=pp_url&'+data.toString(); a.hidden=false;
  }
  go.disabled=false;
});
play();
}
</script>
</body>
</html>
